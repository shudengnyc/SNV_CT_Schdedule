<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>SNV Courts</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <meta name="color-scheme" content="light dark">
<style>
    :root {
      --bg: #f0f4ff; --card: #ffffff; --text: #1f2937; --muted: #6b7280; --line: #e5e7eb;
      --accent: #4f46e5; --accent-soft: #e0e7ff; --warn: #b45309; --warn-soft: #fef3c7;
      --add: #047857; --remove: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1022; --card: #1a1b33; --text: #e5e7eb; --muted: #9ca3af; --line: #2d2f4a;
        --accent: #818cf8; --accent-soft: #2a2c55; --warn: #fbbf24; --warn-soft: #3b2f12;
        --add: #34d399; --remove: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0; padding: 1.25rem 1rem 4rem; background: var(--bg); color: var(--text);
      -webkit-text-size-adjust: 100%;
    }
    .page { max-width: 820px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; margin: 0; }
    h2 { font-size: 1rem; margin: 0 0 .75rem; }
    a { color: var(--accent); }
    select, button {
      font: inherit; padding: .4rem .6rem; border-radius: 8px; border: 1px solid var(--line);
      background: var(--card); color: var(--text);
    }
    .card { background: var(--card); border-radius: 14px; padding: 1rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgb(0 0 0 / .06); }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .75rem; margin-bottom: 1rem; }
    .tile { background: var(--card); border-radius: 14px; padding: .85rem 1rem; box-shadow: 0 1px 3px rgb(0 0 0 / .06); }
    .tile .v { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .tile .l { font-size: .8rem; color: var(--muted); }
    .bars { display: grid; grid-template-columns: auto 1fr auto; gap: .35rem .6rem; align-items: center; font-size: .875rem; }
    .bar { height: 14px; border-radius: 4px; background: var(--accent); min-width: 2px; }
    .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th, td { padding: .4rem .35rem; border-bottom: 1px solid var(--line); text-align: left; }
    th { color: var(--muted); font-weight: 600; }
    td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
    .table-wrap { overflow-x: auto; }
    .tag { font-size: .75rem; font-weight: 600; }
    .tag.added { color: var(--add); }
    .tag.removed { color: var(--remove); }
    tr.same td { background: var(--warn-soft); }
    .pill { display: inline-block; font-size: .7rem; font-weight: 700; color: var(--warn); }
    .muted { color: var(--muted); font-size: .85rem; }
    .lock { max-width: 320px; margin: 20vh auto 0; text-align: center; }
    .lock input {
      font: inherit; font-size: 1.25rem; letter-spacing: .2em; text-align: center; width: 100%;
      padding: .6rem; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text);
    }
    .lock .err { color: var(--remove); min-height: 1.5em; margin-top: .5rem; font-size: .875rem; }
</style>
</head>
<body>
<div class="page">
  <div id="lock" class="lock" hidden>
    <form id="pin-form">
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="Code">
      <button type="submit" style="margin-top:.75rem;width:100%">Enter</button>
    </form>
    <div id="pin-err" class="err"></div>
  </div>

  <div id="app" hidden>
    <header>
      <h1>Court usage</h1>
      <div><select id="year" aria-label="Year"></select> <a href="./">Back</a></div>
    </header>
    <div id="tiles" class="tiles"></div>
    <div class="card"><h2>Court-hours by month</h2><div id="months" class="bars"></div></div>
    <div class="card"><h2>By park</h2><div class="table-wrap"><table id="parks"></table></div></div>
    <div class="card">
      <h2>Booking changes</h2>
      <p class="muted">Seen at 6am, 12pm and 4pm snapshots. Highlighted rows changed on the day of the booking.</p>
      <div class="table-wrap"><table id="changes"></table></div>
    </div>
    <p id="updated" class="muted"></p>
  </div>
</div>

<script>
// SHA-256 of the code, so the code itself isn't in the page source
const CODE_HASH = "42474edf8e334bd0d36bf51f7ec2f03343529aa7ecde7ee47d50ec876e6739f5";
const UNLOCK_KEY = "snv-st-ok";

function storageGet(key) { try { return localStorage.getItem(key); } catch { return null; } }
function storageSet(key, value) { try { localStorage.setItem(key, value); } catch {} }

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function parseCsv(text) {
  const rows = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { field += '"'; i++; } else if (c === '"') q = false; else field += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else field += c;
  }
  const [head = [], ...body] = rows;
  return body.map(r => Object.fromEntries(head.map((h, j) => [h, r[j] ?? ""])));
}

async function loadCsv(path) {
  const res = await fetch(`${path}?t=${Date.now()}`, { cache: "no-store" });
  if (res.status === 404) return [];
  if (!res.ok) throw new Error(`${path}: ${res.status}`);
  return parseCsv(await res.text());
}

const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fmtHours = h => h >= 100 ? Math.round(h).toLocaleString() : h.toFixed(1).replace(/\.0$/, "");
const shortDate = iso => { const [, m, d] = iso.split("-"); return `${+m}/${+d}`; };
const todayIso = () => new Date().toLocaleDateString("en-CA", { timeZone: "America/Los_Angeles" });

let usage = [], changes = [];

function render() {
  const year = document.getElementById("year").value;
  const today = todayIso();
  const rows = usage.filter(u => u.date.startsWith(year));
  const sum = list => list.reduce((s, u) => s + +u.court_hours, 0);
  const daysBack = n => new Date(Date.parse(today) - n * 86400000).toISOString().slice(0, 10);
  const inYear = changes.filter(c => c.date.startsWith(year));
  const sameDay = inYear.filter(c => c.same_day === "Y");

  const tiles = [
    [fmtHours(sum(rows)), `court-hours in ${year}`],
    [fmtHours(sum(usage.filter(u => u.date > daysBack(7) && u.date <= today))), "court-hours, last 7 days"],
    [fmtHours(sum(usage.filter(u => u.date > daysBack(30) && u.date <= today))), "court-hours, last 30 days"],
    [new Set(rows.map(u => u.date)).size, `days with bookings`],
    [inYear.length, "booking changes"],
    [sameDay.length, "same-day changes"]
  ];
  document.getElementById("tiles").innerHTML = tiles
    .map(([v, l]) => `<div class="tile"><div class="v">${v}</div><div class="l">${escapeHtml(l)}</div></div>`).join("");

  const byMonth = Array(12).fill(0);
  rows.forEach(u => { byMonth[+u.date.slice(5, 7) - 1] += +u.court_hours; });
  const maxMonth = Math.max(...byMonth, 1);
  document.getElementById("months").innerHTML = byMonth.map((h, i) => h ? `
    <span>${MONTHS[i]}</span><div class="bar" style="width:${(h / maxMonth) * 100}%"></div><span class="num">${fmtHours(h)}</span>`
    : "").join("") || `<span class="muted">No data yet for ${year}.</span>`;

  const parks = new Map();
  rows.forEach(u => {
    const p = parks.get(u.location) || { hours: 0, days: new Set(), bookings: 0 };
    p.hours += +u.court_hours; p.days.add(u.date); p.bookings += +u.bookings;
    parks.set(u.location, p);
  });
  const parkRows = [...parks].sort((a, b) => b[1].hours - a[1].hours);
  document.getElementById("parks").innerHTML = `
    <tr><th>Park</th><th class="r">Court-hours</th><th class="r">Days</th><th class="r">Bookings</th></tr>
    ${parkRows.map(([name, p]) => `<tr><td>${escapeHtml(name)}</td><td class="r">${fmtHours(p.hours)}</td>
      <td class="r">${p.days.size}</td><td class="r">${p.bookings}</td></tr>`).join("")}`;

  const recent = inYear.slice().reverse().slice(0, 200);
  document.getElementById("changes").innerHTML = recent.length ? `
    <tr><th>Seen</th><th></th><th>Booking</th><th>Park</th><th>Court</th><th>Time</th></tr>
    ${recent.map(c => `<tr class="${c.same_day === "Y" ? "same" : ""}">
      <td>${escapeHtml(shortDate(c.snapshot_at.slice(0, 10)))} ${escapeHtml(c.snapshot_at.slice(11))}</td>
      <td><span class="tag ${c.change}">${c.change === "added" ? "+ added" : "− removed"}</span></td>
      <td>${escapeHtml(shortDate(c.date))}${c.same_day === "Y" ? ' <span class="pill">SAME DAY</span>' : ""}</td>
      <td>${escapeHtml(c.location)}</td><td>${escapeHtml(c.court)}</td>
      <td>${escapeHtml(c.start)}–${escapeHtml(c.end)}</td></tr>`).join("")}`
    : `<tr><td class="muted">No changes recorded yet.</td></tr>`;
}

async function showApp() {
  document.getElementById("lock").hidden = true;
  document.getElementById("app").hidden = false;
  try {
    [usage, changes] = await Promise.all([loadCsv("data/usage_daily.csv"), loadCsv("data/changes.csv")]);
  } catch (err) {
    document.getElementById("tiles").innerHTML = `<p class="muted">Could not load data (${escapeHtml(err.message)}).</p>`;
    return;
  }
  // The sheet has the odd typo'd year; only offer years that look real
  const thisYear = +todayIso().slice(0, 4);
  const years = [...new Set(usage.map(u => +u.date.slice(0, 4)))].filter(y => y >= 2026 && y <= thisYear + 1).sort((a, b) => b - a);
  if (!years.includes(thisYear)) years.unshift(thisYear);
  const select = document.getElementById("year");
  select.innerHTML = years.map(y => `<option>${y}</option>`).join("");
  select.value = thisYear;
  select.onchange = render;
  const last = changes[changes.length - 1];
  document.getElementById("updated").textContent = last ? `Last change seen ${last.snapshot_at}.` : "";
  render();
}

(async () => {
  if (storageGet(UNLOCK_KEY) === CODE_HASH) return showApp();
  const lock = document.getElementById("lock");
  const pin = document.getElementById("pin");
  lock.hidden = false;
  pin.focus();
  document.getElementById("pin-form").addEventListener("submit", async e => {
    e.preventDefault();
    if (await sha256(pin.value.trim()) === CODE_HASH) {
      storageSet(UNLOCK_KEY, CODE_HASH);
      showApp();
    } else {
      pin.value = "";
      document.getElementById("pin-err").textContent = "Not found";
    }
  });
})();
</script>
</body>
</html>

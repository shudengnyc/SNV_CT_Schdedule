<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="manifest" href="manifest.json">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1022" media="(prefers-color-scheme: dark)">

<style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 1.5rem 2rem 8rem;
      min-height: 100vh;
      background: linear-gradient(135deg, #f0f4ff, #e0ecff);
      color: #1f2937;
      -webkit-text-size-adjust: 100%;
    }
    .page {
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.75rem;
      text-align: center;
      margin: 0 0 1rem;
      color: #1e1b4b;
      letter-spacing: -0.01em;
    }
    /* Mobile-friendly styles */
    @media (max-width: 768px) {
      body {
        padding: 0.75rem 12px 8rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0.25rem 0 0.75rem;
      }
    }

    /* Table / Plot switch */
    .view-toggle {
      display: flex;
      width: fit-content;
      margin: 0 auto;
      padding: 3px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid #c7d2fe;
      border-radius: 999px;
    }
    .view-toggle button {
      padding: 7px 22px;
      background: transparent;
      border: none;
      border-radius: 999px;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: #4f46e5;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .view-toggle button.active {
      background: #c7d2fe;
      color: #1e1b4b;
    }

    /* Day picker: always visible, sticks to the top while scrolling */
    /* Bleeds into the body padding so rows scrolling underneath are hidden edge to edge */
    .day-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      margin: 0 -2rem 0.25rem;
      padding: 10px 2rem;
      background: rgba(234, 240, 255, 0.9);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }
    .day-tabs {
      display: flex;
      gap: 4px;
      max-width: 640px;
      margin: 0 auto;
      padding: 4px;
      background: rgba(255, 255, 255, 0.88);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 1px solid #e0e7ff;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.12);
    }
    .day-tabs:empty { display: none; }
    .day-tabs button {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
      padding: 10px 0;
      background: transparent;
      border: none;
      border-radius: 10px;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .day-tabs button:hover { background: #eef2ff; }
    .day-tabs button.active {
      background: #4f46e5;
      color: #fff;
      box-shadow: 0 2px 6px rgba(79, 70, 229, 0.35);
    }
    /* Green dot marks today */
    .day-tabs button.today::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 3px;
      width: 5px;
      height: 5px;
      margin-left: -2.5px;
      border-radius: 50%;
      background: #22c55e;
    }
    @media (max-width: 768px) {
      .day-bar { margin: 0 -12px 0.25rem; padding: 8px 12px; }
      .day-tabs button {
        padding: 9px 0;
        font-size: 0.85rem;
      }
    }

    .day-section {
      display: none;
      animation: fadeSlide 0.35s ease;
    }
    .day-section.active {
      display: block;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .date-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.3rem;
      font-weight: 600;
      color: #4f46e5;
      margin: 1.5rem 0 0.75rem;
      padding-left: 10px;
      border-left: 4px solid #6366f1;
    }
    .today-chip {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #15803d;
      background: #dcfce7;
      padding: 2px 8px;
      border-radius: 999px;
    }
    @media (max-width: 768px) {
      .date-title {
        font-size: 1.05rem;
        margin: 1rem 0 0.5rem;
      }
    }

    /* Collapsible week groups */
    .week-group {
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      margin-bottom: 1rem;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.06);
      overflow: hidden;
    }
    .week-group > summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #4f46e5;
      user-select: none;
      transition: background 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .week-group > summary::-webkit-details-marker { display: none; }
    .week-group > summary::before {
      content: "▸";
      font-size: 0.85rem;
      color: #94a3b8;
      transition: transform 0.2s ease;
    }
    .week-group[open] > summary::before { transform: rotate(90deg); }
    .week-group > summary:hover { background: rgba(99, 102, 241, 0.06); }
    .week-count {
      margin-left: auto;
      font-size: 0.78rem;
      font-weight: 600;
      color: #64748b;
      background: #eef2ff;
      padding: 2px 10px;
      border-radius: 999px;
    }
    .week-group .date-title:first-of-type { margin-top: 0.5rem; }
    .week-group > *:not(summary) { margin-left: 18px; margin-right: 18px; }
    /* width:100% plus side margins would overflow the card and clip the Time column */
    .week-group > table { width: calc(100% - 36px); }
    .week-group > table:last-child { margin-bottom: 1.25rem; }
    /* This Week: highlighted as the primary group */
    .week-this {
      background: linear-gradient(135deg, #ffffff, #eef2ff);
      border-color: #c7d2fe;
      box-shadow: 0 4px 16px rgba(79, 70, 229, 0.12);
    }
    .week-this > summary { font-size: 1.2rem; }
    .week-this > summary .week-label::after {
      content: "•";
      color: #22c55e;
      margin-left: 8px;
    }
    @media (max-width: 768px) {
      .week-group { border-radius: 12px; }
      .week-group > summary { font-size: 1rem; padding: 12px 14px; }
      .week-this > summary { font-size: 1.05rem; }
      .week-group > *:not(summary) { margin-left: 8px; margin-right: 8px; }
      .week-group > table { width: calc(100% - 16px); }
      .week-group > table:last-child { margin-bottom: 8px; }
    }

    table {
      width: 100%;
      table-layout: fixed;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 4px 12px rgba(15, 23, 42, 0.05);
      margin-bottom: 2rem;
      border-collapse: collapse;
      font-size: 1.05rem;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;

    }
    th {
      background: #4f46e5;

    @media (max-width: 768px) {
      table {
        font-size: 0.88rem;
        border-radius: 10px;
        margin-bottom: 1rem;
      }

        padding: 9px 8px;
      }
      th { font-size: 0.66rem; }
      th:nth-child(1) { width: 36%; }
      th:nth-child(2) { width: 19%; }
      th:nth-child(3) { width: 45%; }

    /* Floating copy buttons */
    .buttons-container {
      position: fixed;
      right: max(16px, env(safe-area-inset-right));

      align-items: flex-end;
      gap: 10px;

    .action-button {

      align-items: center;
      gap: 8px;

      padding: 0 20px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 999px;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
      transition: transform 0.15s ease, background 0.15s ease;
      -webkit-tap-highlight-color: transparent;

    .action-button:hover { background: #4338ca; }
    .action-button:active { transform: scale(0.96); }
    .action-button.secondary {
      background: white;

    .copy-toast {

      padding: 10px 20px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 100;

    .primary-button {
      display: inline-block;
      background: #4f46e5;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 999px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .primary-button:hover { background: #4338ca; }
    .source-link {

    .source-link a {

      text-decoration: none;
      padding: 8px 16px;
      border: 1px solid #c7d2fe;
      border-radius: 999px;

    .plot-container {
      background: white;

      border-radius: 12px;

      margin-bottom: 2rem;

      min-height: 600px;

      overflow: auto;
      display: flex;
      flex-direction: column;

    /* Mobile-specific plot container adjustments */
    @media (max-width: 768px) {
      .plot-container {
        padding: 8px;
        height: calc(100vh - 150px);

    .status-message {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid #e2e8f0;
      border-radius: 12px;

      margin: 1rem 0;

      text-align: center;
    }
    .status-message.warning {
      border-color: #fcd34d;

    /* Improve canvas display */
    #schedule-plot {
      max-width: 100%;

    @media (max-width: 768px) {
      #schedule-plot {

      /* Fix horizontal scrolling issues on mobile */
      .plot-container::-webkit-scrollbar {

        border-radius: 3px;

      .plot-container::-webkit-scrollbar-track {

    /* Dark mode: follows the system setting */
    @media (prefers-color-scheme: dark) {
      body { background: linear-gradient(135deg, #0f1022, #161a33); color: #e2e8f0; }
      h1 { color: #e0e7ff; }
      .view-toggle { background: rgba(30, 32, 58, 0.7); border-color: #3730a3; }
      .view-toggle button { color: #a5b4fc; }
      .view-toggle button.active { background: #4338ca; color: #fff; }
      .day-bar { background: rgba(15, 16, 34, 0.85); }
      .day-tabs { background: rgba(30, 32, 58, 0.9); border-color: #312e81; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4); }
      .day-tabs button { color: #cbd5e1; }
      .day-tabs button:hover { background: #2a2d52; }
      .day-tabs button.active { background: #6366f1; color: #fff; }
      .date-title { color: #a5b4fc; border-left-color: #818cf8; }
      .today-chip { color: #86efac; background: rgba(34, 197, 94, 0.18); }
      .week-group { background: rgba(26, 27, 46, 0.75); border-color: #2a2d4a; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); }
      .week-group > summary { color: #a5b4fc; }
      .week-group > summary:hover { background: rgba(129, 140, 248, 0.08); }

      .copy-toast { background: rgba(224, 231, 255, 0.95); color: #1e1b4b; }

<body>
<div class="page">
  <h1>SNV Lifetime Courts Schedule</h1>

  <div class="view-toggle">
    <button id="table-view-btn" class="active">Table</button>
    <button id="plot-view-btn">Plot</button>
  </div>

  <div class="day-bar">
    <nav id="tab-buttons" class="day-tabs" aria-label="Choose a day"></nav>
  </div>

  <div id="table-container"><div class="status-message">Loading schedule…</div></div>
  <div id="plot-container" class="plot-container" style="display:none;">
    <canvas id="schedule-plot"></canvas>
  </div>

  <div class="source-link">
    <a href="https://docs.google.com/spreadsheets/d/1zpnq9KvS73oZ8SK1JbUaBuK9u9nv_3NArXW1Hy7Pkzs/edit?gid=0#gid=0" target="_blank" rel="noopener">Show Original Data</a>
  </div>
</div>
  <div class="buttons-container">
    <button id="copy-plot-button" class="action-button secondary" title="Copy plot image" style="display:none;"><span aria-hidden="true">🖼️</span>Copy image</button>
    <button id="copy-button" class="action-button" title="Copy schedule text"><span aria-hidden="true">📋</span>Copy text</button>
  </div>
<script>
const spreadsheetId = "1zpnq9KvS73oZ8SK1JbUaBuK9u9nv_3NArXW1Hy7Pkzs";
const courtSheetTabs = [
  "  Fremont High School",
  "Sunnyvale Middle School (Mango)",
  "Serra Park",
  "Ortega Park",
  "Ponderosa Park",
  "Washington Park",
  "Braly Park",
  "Encinal Park",
  "Orchard Gardens",
  "Columbia Park",
  "Lakewood Park",
  "Fairwood Park",
  "Seven Seas"
];
const gvizSheetUrl = (sheetName, callbackName) =>
  `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&range=A:E&tqx=out:json;responseHandler:${callbackName}`;

// Helper function to process court numbers
function processCourt(courtValue) {
  const raw = (courtValue ?? "").toString().trim();
  if (!raw) return ["N/A"];
  if (/^n\/?a$/i.test(raw)) return ["N/A"];

  const cleaned = raw
    .toLowerCase()
    .replace(/\b(courts?|ct\.?)\b/g, "")
    .replace(/[^\d,\-\/&\s]/g, " ");

  const tokens = cleaned.split(/[,/&\s]+/).map(t => t.trim()).filter(Boolean);
  const courts = new Set();
  const maxReasonableCourt = 30;

  const pushCourt = (num) => {
    const n = parseInt(num, 10);
    if (!Number.isNaN(n) && n > 0 && n <= maxReasonableCourt) {
      courts.add(`Ct${n}`);
    }
  };

  tokens.forEach(token => {
    if (token.includes("-")) {
      const [startRaw, endRaw] = token.split("-");
      const start = parseInt(startRaw, 10);
      const end = parseInt(endRaw, 10);
      if (!Number.isNaN(start) && !Number.isNaN(end) && start <= end && end <= maxReasonableCourt) {
        for (let i = start; i <= end; i++) pushCourt(i);
        return;
      }
    }

    if (/^\d+$/.test(token)) {
      const value = parseInt(token, 10);
      if (value > maxReasonableCourt && token.length <= 3) {
        token.split("").forEach(pushCourt);
      } else {
        pushCourt(value);
      }
    }
  });

  return courts.size > 0 ? Array.from(courts) : ["N/A"];
}

// Helper function to format courts compactly for display
function compactCourtsDisplay(courts) {
  if (courts.length <= 1) return courts.join(', ');
  
  // Extract court numbers for processing
  const numbers = courts.map(court => {
    const match = court.match(/(\d+)/);
    return match ? parseInt(match[1]) : null;
  }).filter(num => num !== null);
  
  if (numbers.length !== courts.length) {
    // Not all courts have numbers, just join them as is
    return courts.join(', ');
  }
  
  // Sort numbers
  numbers.sort((a, b) => a - b);
  
  // Find ranges
  const ranges = [];
  let rangeStart = numbers[0];
  let rangeEnd = numbers[0];
  
  for (let i = 1; i < numbers.length; i++) {
    if (numbers[i] === rangeEnd + 1) {
      // Continue the range
      rangeEnd = numbers[i];
    } else {
      // End the current range and start a new one
      if (rangeStart === rangeEnd) {
        ranges.push(`Ct${rangeStart}`);
      } else {
        ranges.push(`Ct${rangeStart}-${rangeEnd}`);
      }
      rangeStart = rangeEnd = numbers[i];
    }
  }
  
  // Add the last range
  if (rangeStart === rangeEnd) {
    ranges.push(`Ct${rangeStart}`);
  } else {
    ranges.push(`Ct${rangeStart}-${rangeEnd}`);
  }
  
  return ranges.join(', ');
}

// Helper function to clean and standardize a single time with context
function cleanSingleTime(timeStr, contextPeriod = null) {
  if (!timeStr) return '';
  
  
  // First, check if there's an explicit AM/PM in the input
  const explicitPeriodMatch = timeStr.match(/([AP])M?\b/i);
  let explicitPeriod = explicitPeriodMatch ? `${explicitPeriodMatch[1].toUpperCase()}M` : null;
  
  
  // Remove all non-time characters except numbers and colon
  const cleanedTime = timeStr.replace(/[^0-9:]/g, '');
  
  
  if (!cleanedTime) return '';
  
  // Ensure minutes exist
  let timePart = cleanedTime;
  if (!timePart.includes(':')) {
    timePart = timePart + ':00';
  }
  
  // Parse hours and minutes
  const timeParts = timePart.split(':');
  if (timeParts.length < 2) return '';
  
  let hours = parseInt(timeParts[0]);
  let minutes = parseInt(timeParts[1]);
  
  
  // Validate hours and minutes are reasonable numbers
  if (isNaN(hours) || isNaN(minutes)) return '';
  if (hours < 0 || hours > 23) return '';
  if (minutes < 0 || minutes > 59) return '';
  
  // Determine the period to use (explicit takes priority over context)
  let period;
  if (explicitPeriod) {
    period = explicitPeriod;
  } else if (contextPeriod) {
    period = contextPeriod;
  } else {
    // Only guess period if none exists and no context
    
    // Tennis court specific logic: consider both the hour and common patterns
    if (hours === 10) {
      // Special case: 10:30 is typically a morning class (10:30 AM)
      period = 'AM';
    }
    else if (hours >= 9 && hours <= 11) {
      // 9-11 are typically morning classes
      period = 'AM';
    }
    else if (hours >= 1 && hours <= 6) {
      // 1-6 are typically afternoon/evening classes  
      period = 'PM';
    }
    else if (hours === 7 || hours === 8) {
      // 7-8 are ambiguous, but more commonly evening classes in tennis courts
      period = 'PM';
    }
    // For times 12, assume PM (noon/midnight context will be determined by other factors)
    else if (hours === 12) {
      period = 'PM';
    }
    // For times 0, assume AM (midnight)
    else if (hours === 0) {
      period = 'AM';
    }
    // For other cases, assume AM
    else {
      period = 'AM';
    }
  }
  
  
  // Ensure we're working with valid 12-hour format
  if (hours > 12) {
    // This shouldn't happen with proper input, but handle it
    hours = hours - 12;
    period = 'PM';
  }
  if (hours === 0) {
    hours = 12;
    period = 'AM';
  }
  
  // Format minutes
  minutes = minutes.toString().padStart(2, '0');
  
  const result = `${hours}:${minutes}${period}`;
  
  return result;
}

// Helper function to convert 24-hour time to 12-hour format with period
function format24to12Hour(hour24) {
  let period = 'AM';
  let hour12 = hour24;
  
  if (hour24 >= 12) {
    period = 'PM';
    if (hour24 > 12) hour12 = hour24 - 12;
  }
  if (hour12 === 0) hour12 = 12;
  
  return { hour: hour12, period };
}

// Process a single time range (e.g. "1:30pm-3:30pm") with context
function processTimeRange(timeRange, contextPeriod = null) {
  if (!timeRange) return '';
  
  // Clean input and convert semicolons to colons first
  timeRange = timeRange.trim().replace(/;/g, ':');
  
  // Check if it's a time range with hyphen
  const parts = timeRange.split('-');
  
  // Process single time
  if (parts.length === 1) {
    const result = cleanSingleTime(parts[0], contextPeriod);
    if (result) {
      const periodMatch = result.match(/([AP]M)$/);
      const period = periodMatch ? periodMatch[1] : contextPeriod;
      return { result, period };
    }
    return '';
  }
  
  // Process time range
  if (parts.length === 2) {
    // Special handling: if the entire range ends with AM/PM (like "7-8:30pm"), 
    // that period should apply to the whole range
    const rangeEndPeriodMatch = timeRange.match(/([AP])M?\s*$/i);
    const rangeEndPeriod = rangeEndPeriodMatch ? `${rangeEndPeriodMatch[1].toUpperCase()}M` : null;
    
    
    // For start time: don't inherit period from end time, let it be determined by its own logic
    const hasStartExplicitPeriod = /[AP]M?\b/i.test(parts[0]);
    let startContextPeriod = contextPeriod;
    // Removed automatic inheritance of end period for start time
    
    const startTime = cleanSingleTime(parts[0], startContextPeriod);
    
    // Extract period from start time to use as context for end time
    const startMatch = startTime.match(/([AP]M)$/);
    const startPeriod = startMatch ? startMatch[1] : contextPeriod;
    
    // For end time, only use start period as context if the end time doesn't have explicit period
    const hasEndExplicitPeriod = /[AP]M?\b/i.test(parts[1]);
    let endContextPeriod = hasEndExplicitPeriod ? null : startPeriod;
    
    // Special case: if start time is 10:30AM and end time is 12:00, it should be 12:00PM (noon)
    if (startTime === '10:30AM' && parts[1].trim() === '12:00') {
      endContextPeriod = 'PM';
    }
    // More generally: if start is AM and end hour is 12, it should be PM (noon)
    else if (startPeriod === 'AM' && parts[1].trim().startsWith('12:')) {
      endContextPeriod = 'PM';
    }
    
    const endTime = cleanSingleTime(parts[1], endContextPeriod);
    
    if (!startTime || !endTime) return '';
    
    
    // Parse times for range validation
    const startTimeMatch = startTime.match(/(\d+):(\d+)([AP]M)/);
    const endTimeMatch = endTime.match(/(\d+):(\d+)([AP]M)/);
    
    if (!startTimeMatch || !endTimeMatch) return '';
    
    const [, startHour, startMinutes, startTimePeriod] = startTimeMatch;
    const [, endHour, endMinutes, endTimePeriod] = endTimeMatch;
    
    // Convert to 24-hour for range calculation
    let startHour24 = parseInt(startHour);
    let endHour24 = parseInt(endHour);
    
    if (startTimePeriod === 'PM' && startHour24 !== 12) startHour24 += 12;
    if (endTimePeriod === 'PM' && endHour24 !== 12) endHour24 += 12;
    if (startTimePeriod === 'AM' && startHour24 === 12) startHour24 = 0;
    if (endTimePeriod === 'AM' && endHour24 === 12) endHour24 = 0;
    
    
    // Calculate range length
    let rangeLength = endHour24 - startHour24;
    if (rangeLength < 0) rangeLength += 24;
    
    
    // Only adjust if the range is clearly invalid (> 12 hours)
    if (rangeLength > 12) {
      // Calculate new end time (2 hours after start for reasonable default)
      let newEndHour24 = startHour24 + 2;
      if (newEndHour24 >= 24) newEndHour24 -= 24;
      
      // Convert back to 12-hour format
      const { hour: newEndHour, period: newEndPeriod } = format24to12Hour(newEndHour24);
      
      // Keep original minutes
      const adjustedResult = `${startTime}-${newEndHour}:${endMinutes}${newEndPeriod}`;
      return { result: adjustedResult, period: startTimePeriod };
    }
    
    const result = `${startTime}-${endTime}`;
    return { result, period: startTimePeriod };
  }
  
  return '';
}

// Main time processing function for multiple time ranges
function processTime(timeStr) {
  if (!timeStr) return '';
  
  // Clean the input: remove trailing commas and extra whitespace.
  // A semicolon between digits is a typo for a colon ("1;30pm"); fix it before we
  // split on semicolons as a range separator below.
  timeStr = timeStr.replace(/(\d);(\d)/g, '$1:$2').replace(/,\s*$/, '').trim();

  // Split by commas, semicolons, ampersands, OR spaces for multiple time ranges
  // We'll use a regex to properly split by commas, semicolons, ampersands, or spaces that aren't part of time values
  // Split by spaces only if they separate complete time ranges (containing hyphens)
  let timeRanges;
  
  // Check if this looks like space-separated multiple time ranges
  // Pattern: multiple parts separated by spaces, each containing a hyphen
  const spaceSeparatedParts = timeStr.split(/\s+/).filter(part => part.trim());
  const hasMultipleTimeRanges = spaceSeparatedParts.length > 1 && 
                               spaceSeparatedParts.every(part => part.includes('-'));
  
  if (hasMultipleTimeRanges) {
    // Split by spaces for multiple time ranges like "4:00pm-4:30pm 5:30-6:30pm"
    timeRanges = spaceSeparatedParts;
  } else {
    // Use original splitting for commas, semicolons, ampersands
    timeRanges = timeStr.split(/[,;&]\s*/).filter(range => range.trim());
  }
  
  // Process each time range independently first to check for explicit periods
  const processedRanges = [];
  let contextPeriod = null;
  
  for (const range of timeRanges) {
    // Check if this range has explicit AM/PM - if so, don't use context
    const hasExplicitPeriod = /[AP]M?\b/i.test(range);
    const useContext = !hasExplicitPeriod ? contextPeriod : null;
    
    
    const processed = processTimeRange(range.trim(), useContext);
    
    if (processed) {
      // Handle both string and object returns
      if (typeof processed === 'string') {
        processedRanges.push(processed);
        // Extract period for context - update only if we found a period
        const periodMatch = processed.match(/([AP]M)/);
        if (periodMatch) {
          contextPeriod = periodMatch[1];
        }
      } else if (processed.result) {
        processedRanges.push(processed.result);
        // Use the period from the processed result
        if (processed.period) {
          contextPeriod = processed.period;
        }
      }
    }
  }
  
  // Join back with commas
  return processedRanges.join(', ');
}

// Helper function to parse time string into hours (for plotting)
function parseTimeToHours(timeStr) {
  if (!timeStr) return null;
  
  // Clean the time string and handle various formats
  timeStr = timeStr.trim();
  
  // Try to match the standard format first: "7:00PM", "12:30AM", etc.
  const match = timeStr.match(/(\d+):(\d+)([AP]M)/i);
  if (!match) {
    return null;
  }
  
  let [, hours, minutes, period] = match;
  hours = parseInt(hours);
  minutes = parseInt(minutes);
  period = period.toUpperCase();
  
  // Convert to 24-hour format
  if (period === 'PM' && hours !== 12) hours += 12;
  if (period === 'AM' && hours === 12) hours = 0;
  
  // Return as decimal hours
  const result = hours + (minutes / 60);
  return result;
}

// Extract time ranges for plotting
function extractTimeRanges(timeStr) {
  if (!timeStr) return [];
  
  // Clean the input: remove trailing commas and extra whitespace
  timeStr = timeStr.replace(/,\s*$/, '').trim();
  
  const ranges = [];
  const timeRanges = timeStr.split(/[,;&]\s*/).filter(range => range.trim());
  
  for (const range of timeRanges) {
    // Check if it's a range (contains dash) or single time
    if (range.includes('-')) {
      const parts = range.split('-');
      if (parts.length === 2) {
        const startStr = parts[0].trim();
        const endStr = parts[1].trim();
        
        const start = parseTimeToHours(startStr);
        const end = parseTimeToHours(endStr);
        
        if (start !== null && end !== null) {
          ranges.push({ start, end });
        }
      }
    } else {
      // Single time - create a 1-hour block for visualization
      const singleTime = parseTimeToHours(range.trim());
      if (singleTime !== null) {
        ranges.push({ start: singleTime, end: singleTime + 1 });
      }
    }
  }
  
  return ranges;
}

function normalizeDay(dayValue) {
  const day = (dayValue || "").toString().trim().toLowerCase();
  const dayMap = {
    sunday: "Sunday",
    monday: "Monday",
    tuesday: "Tuesday",
    wednesday: "Wednesday",
    thursday: "Thursday",
    friday: "Friday",
    saturday: "Saturday"
  };
  return dayMap[day] || "";
}

function normalizeLocationName(sheetName) {
  const normalized = (sheetName || "")
    .toString()
    .replace(/\s+/g, " ")
    .trim();

  if (normalized === "Sunnyvale Middle School (Mango)") return "Mango";
  return normalized;
}

// Short labels for locations, used in the plot axis, legend and copied text
const locationAbbreviations = [

function abbreviateLocation(text) {
  let out = text;
  for (const [full, short] of locationAbbreviations) out = out.replace(full, short);
  return out;
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function courtNumber(court) {
  const match = String(court).match(/(\d+)/);
  return match ? parseInt(match[1], 10) : 0;
}

function excelSerialToDate(serial) {
  const excelEpoch = new Date(Date.UTC(1899, 11, 30));
  const millis = Math.round(Number(serial) * 86400000);
  return new Date(excelEpoch.getTime() + millis);
}

function normalizeDateCell(dateValue) {
  if (typeof dateValue === "string" && /^\d+(\.\d+)?$/.test(dateValue.trim())) {
    dateValue = Number(dateValue);
  }

  if (typeof dateValue === "string") {
    const gvizDate = dateValue.match(/^Date\((\d+),(\d+),(\d+)\)$/);
    if (gvizDate) {
      const year = parseInt(gvizDate[1], 10);
      const month = parseInt(gvizDate[2], 10) + 1;
      const day = parseInt(gvizDate[3], 10);
      return {
        dateStr: `${month}/${day}/${year}`,
        dateObj: new Date(year, month - 1, day)
      };
    }
  }

  if (typeof dateValue === "number" && Number.isFinite(dateValue) && dateValue > 30000 && dateValue < 70000) {
    const d = excelSerialToDate(dateValue);
    const month = d.getUTCMonth() + 1;
    const day = d.getUTCDate();
    const year = d.getUTCFullYear();
    return {
      dateStr: `${month}/${day}/${year}`,
      dateObj: new Date(year, month - 1, day)
    };
  }

  const raw = (dateValue || "").toString().trim();
  if (!raw || /^ongoing$/i.test(raw)) return null;

  // Handle M/D and M/D/YY(YY) explicitly first: `new Date("9/14")` would silently
  // resolve to the year 2001 in most browsers.
  const mmdd = raw.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
  if (mmdd) {
    const month = parseInt(mmdd[1], 10);
    const day = parseInt(mmdd[2], 10);
    const yearRaw = mmdd[3] ? parseInt(mmdd[3], 10) : new Date().getFullYear();
    const year = yearRaw < 100 ? yearRaw + 2000 : yearRaw;
    return {
      dateStr: `${month}/${day}/${year}`,
      dateObj: new Date(year, month - 1, day)
    };
  }

  const direct = new Date(raw);
  if (!Number.isNaN(direct.getTime())) {
    const month = direct.getMonth() + 1;
    const day = direct.getDate();
    const year = direct.getFullYear();
    return {
      dateStr: `${month}/${day}/${year}`,
      dateObj: new Date(year, month - 1, day)
    };
  }

  return null;
}

function normalizeRawTimeValue(timeValue) {
  if (timeValue === null || timeValue === undefined) return "";

  if (typeof timeValue === "number" && Number.isFinite(timeValue)) {
    if (timeValue > 1000) return "";
    if (timeValue > 0 && timeValue < 1) {
      const totalMinutes = Math.round(timeValue * 24 * 60);
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      return `${hours}:${minutes.toString().padStart(2, "0")}`;
    }
    if (timeValue >= 1 && timeValue <= 24) {
      return `${Math.round(timeValue)}:00`;
    }
    return "";
  }

  return timeValue
    .toString()
    .replace(/\u2013|\u2014/g, "-")
    .replace(/\bnoon\b/gi, "12:00PM")
    .replace(/\bmidnight\b/gi, "12:00AM")
    .replace(/\s+/g, " ")
    .trim();
}

function fetchSheetRowsViaGviz(sheetName) {
  return new Promise((resolve, reject) => {
    const callbackName = `__gviz_cb_${Date.now()}_${Math.floor(Math.random() * 100000)}`;
    const script = document.createElement("script");
    const cleanup = () => {
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    };

    window[callbackName] = (response) => {
      cleanup();
      if (!response || response.status !== "ok" || !response.table) {
        reject(new Error(`GViz response invalid for ${sheetName}`));
        return;
      }
      resolve(response.table.rows || []);
    };

    script.onerror = () => {
      cleanup();
      reject(new Error(`Failed to load GViz sheet ${sheetName}`));
    };

    script.src = gvizSheetUrl(sheetName, callbackName);
    document.head.appendChild(script);
  });
}

async function fetchAndRenderTable() {
  const expectedDays = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const weekdayOrder = {"Monday":1,"Tuesday":2,"Wednesday":3,"Thursday":4,"Friday":5,"Saturday":6,"Sunday":7};

  const tabs = document.getElementById("tab-buttons");
  const container = document.getElementById("table-container");
  try {
    let rawData = [];
    const failedSheets = [];
    // Fetch all sheets in parallel for much faster load (order is restored by sorting later)
    const sheetResults = await Promise.allSettled(
      courtSheetTabs.map(sheetName => fetchSheetRowsViaGviz(sheetName))
    );

    courtSheetTabs.forEach((sheetName, sheetIndex) => {
      const result = sheetResults[sheetIndex];
      if (result.status !== "fulfilled") {
        console.warn(`Failed to fetch sheet "${sheetName}" via GViz:`, result.reason);
        failedSheets.push(normalizeLocationName(sheetName));
        return;
      }
      const rows = result.value;
      if (!Array.isArray(rows) || rows.length === 0) return;

      const location = normalizeLocationName(sheetName);
      let lastDay = "";
      let lastDate = null;

      rows.forEach(row => {
        if (!row || !Array.isArray(row.c)) return;
        const cells = row.c;

        const dayCandidate = cells[0]?.v ?? cells[0]?.f ?? "";
        const dateCandidate = cells[1]?.v ?? cells[1]?.f ?? null;
        const timeCandidate = cells[2]?.v ?? cells[2]?.f ?? "";
        const courtCandidate = cells[3]?.f ?? cells[3]?.v ?? "";

        const dayCell = (dayCandidate || "").toString().trim();
        const day = normalizeDay(dayCell || lastDay);
        if (dayCell) lastDay = dayCell;
        if (!day || !expectedDays.includes(day)) return;

        const dateCell = (dateCandidate !== null && dateCandidate !== "") ? dateCandidate : lastDate;
        if (dateCandidate !== null && dateCandidate !== "") lastDate = dateCandidate;
        const normalizedDate = normalizeDateCell(dateCell);
        if (!normalizedDate) return;

        const rawTime = normalizeRawTimeValue(timeCandidate);
        if (!rawTime) return;
        if (/^\d{4,}(\.\d+)?$/.test(rawTime)) return;

        let rawCourt = courtCandidate;
        if (rawCourt === "" || rawCourt === null || rawCourt === undefined) {
          rawCourt = "N/A";
        }

        const normalizedTime = processTime(rawTime);
        if (!normalizedTime) return;

        const courtNumbers = processCourt(rawCourt);
        courtNumbers.forEach(court => {
          rawData.push({
            Day: day,
            Date: normalizedDate.dateStr,
            DateObj: normalizedDate.dateObj,
            RawTime: rawTime,
            Time: normalizedTime,
            RawCourt: (rawCourt ?? "").toString(),
            Court: court,
            Location: location
          });
        });
      });
    });

    // Second pass: drop exact duplicates (same day/date/location/court/time)
    const seen = new Set();
    const cleaned = rawData.filter(item => {
      const key = `${item.Day}|${item.Date}|${item.Location}|${item.Court}|${item.Time}`;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    // Sort by day, date, location, court
    cleaned.sort((a, b) => {
      if (weekdayOrder[a.Day] !== weekdayOrder[b.Day])
        return weekdayOrder[a.Day] - weekdayOrder[b.Day];
      if (b.DateObj - a.DateObj !== 0)
        return b.DateObj - a.DateObj;
      if (a.Location !== b.Location)
        return a.Location.localeCompare(b.Location);
      return courtNumber(a.Court) - courtNumber(b.Court);
    });

    // Rows for one weekday, used by the plot and the copy-text builder
    const getDayRows = (day) => cleaned.filter(row => row.Day === day);

    if (cleaned.length === 0) {
      let msg;
      if (failedSheets.length === courtSheetTabs.length) {
        const firstError = sheetResults.find(r => r.status === "rejected")?.reason?.message || "";
        msg = "Could not load any schedule data from Google Sheets. ";
        msg += location.protocol === "file:"
          ? "This page was opened as a local file; some browsers block remote scripts in that mode. Try the deployed site or serve it over http."
          : "Check your network connection, ad/content blockers, or the spreadsheet sharing settings.";
        if (firstError) msg += ` (${firstError})`;
      } else {
        msg = "No schedule entries were found in the spreadsheet.";
      }
      container.innerHTML = `<div class="status-message warning">${escapeHtml(msg)}<br><br><button class="primary-button" onclick="location.reload()">Retry</button></div>`;
      return;
    }

    // Group for display
    const grouped = {};
    cleaned.forEach(row => {
      if (!grouped[row.Day]) grouped[row.Day] = {};
      if (!grouped[row.Day][row.Date]) grouped[row.Day][row.Date] = [];
      grouped[row.Day][row.Date].push(row);
    });

    container.innerHTML = "";
    tabs.innerHTML = "";

    if (failedSheets.length > 0) {
      const warn = document.createElement("div");
      warn.className = "status-message warning";
      warn.textContent = `Could not load ${failedSheets.length} location(s): ${failedSheets.join(", ")}. Their schedules are not shown.`;
      container.appendChild(warn);
    }

    // Compute the start of the current week (Sunday, local midnight) for week bucketing
    const weekStart = new Date();
    weekStart.setHours(0, 0, 0, 0);
    weekStart.setDate(weekStart.getDate() - weekStart.getDay());

    // Classify a date into a week bucket relative to the current week
    function getWeekBucket(dateObj) {
      const d = new Date(dateObj);
      d.setHours(0, 0, 0, 0);
      const diffDays = Math.round((d - weekStart) / 86400000);
      if (diffDays >= 0 && diffDays <= 6)   return { key: "this",    label: "This Week",  order: 0, open: true };
      if (diffDays >= 7 && diffDays <= 13)  return { key: "next",    label: "Next Week",  order: 1, open: false };
      if (diffDays >= 14)                   return { key: "later",   label: "Upcoming",   order: 2, open: false };
      if (diffDays >= -7 && diffDays <= -1) return { key: "last",    label: "Last Week",  order: 3, open: false };
      return                                       { key: "earlier", label: "Earlier",    order: 4, open: false };
    }

    const todayMidnight = new Date();
    todayMidnight.setHours(0, 0, 0, 0);
    const todayName = expectedDays[todayMidnight.getDay()];

    for (const day of expectedDays) {
      if (grouped[day]) {
        const btn = document.createElement("button");
        btn.textContent = day.substring(0, 3);
        btn.title = day;
        btn.dataset.day = day;
        if (day === todayName) btn.classList.add("today");
        btn.onclick = () => {
          switchTab(day);
          // If scrolled down, jump back so the new day's schedule starts just under the day bar
          const barTop = document.querySelector(".view-toggle").getBoundingClientRect().bottom + window.scrollY;
          if (window.scrollY > barTop) window.scrollTo({ top: barTop });
        };
        tabs.appendChild(btn);

        const section = document.createElement("div");
        section.id = `section-${day}`;
        section.className = "day-section";

        // Build collapsible week groups; This Week is rendered first and expanded
        const bucketEls = {};
        const ensureBucket = (info) => {
          if (bucketEls[info.key]) return bucketEls[info.key];
          const details = document.createElement("details");
          details.className = `week-group week-${info.key}`;
          if (info.open) details.open = true;
          const summary = document.createElement("summary");
          summary.innerHTML = `<span class="week-label">${info.label}</span><span class="week-count"></span>`;
          details.appendChild(summary);
          details._order = info.order;
          details._count = 0;
          bucketEls[info.key] = details;
          return details;
        };

        for (const date of Object.keys(grouped[day]).sort((a, b) => new Date(b) - new Date(a))) {
          const bucketInfo = getWeekBucket(new Date(date));
          const bucket = ensureBucket(bucketInfo);
          bucket._count += 1;

          const dateTitle = document.createElement("div");
          dateTitle.className = "date-title";
          dateTitle.textContent = date;
          if (new Date(date).setHours(0, 0, 0, 0) === todayMidnight.getTime()) {
            const chip = document.createElement("span");
            chip.className = "today-chip";
            chip.textContent = "Today";
            dateTitle.appendChild(chip);
          }
          bucket.appendChild(dateTitle);

          const table = document.createElement("table");
          const thead = document.createElement("thead");
          const headRow = document.createElement("tr");

          ["Location", "Courts", "Time"].forEach(header => {
            const th = document.createElement("th");
            th.textContent = header;
            headRow.appendChild(th);
          });

          thead.appendChild(headRow);
          table.appendChild(thead);

          const tbody = document.createElement("tbody");
          
          // Group by location and time
          const locationTimeGroups = {};
          
          // Sort entries by location and court number
          grouped[day][date].sort((a, b) => {
            if (a.Location !== b.Location) return a.Location.localeCompare(b.Location);
            return courtNumber(a.Court) - courtNumber(b.Court);
          }).forEach(row => {
            // Use the original row data to preserve court groupings from the same row
            const key = `${row.Location}|${row.Time}|${row.RawCourt}`;
            
            
            if (!locationTimeGroups[key]) {
              locationTimeGroups[key] = {
                location: row.Location,
                time: row.Time,
                courts: [row.Court],
                rawCourt: row.RawCourt
              };
            } else {
              // Add court if not already included
              if (!locationTimeGroups[key].courts.includes(row.Court)) {
                locationTimeGroups[key].courts.push(row.Court);
              }
            }
          });
          
          
          // Sort by location
          Object.values(locationTimeGroups)
            .sort((a, b) => a.location.localeCompare(b.location))
            .forEach(group => {
              const tr = document.createElement("tr");
              
              // Sort and format the courts for display
              const sortedCourts = group.courts.sort((a, b) => courtNumber(a) - courtNumber(b));
              
              // Format courts compactly when possible
              const formattedCourts = compactCourtsDisplay(sortedCourts);
              
              [group.location, formattedCourts].forEach(cell => {
                const td = document.createElement("td");
                td.textContent = cell;
                tr.appendChild(td);
              });

              // One time range per line, earliest first
              const timeTd = document.createElement("td");
              group.time.split(/,\s*/).filter(Boolean)
                .sort((a, b) => (parseTimeToHours(a) ?? 0) - (parseTimeToHours(b) ?? 0))
                .forEach(range => {
                  const span = document.createElement("span");
                  span.className = "time-range";
                  span.textContent = range;
                  timeTd.appendChild(span);
                });
              tr.appendChild(timeTd);
              
              tbody.appendChild(tr);
              
            });
          
          table.appendChild(tbody);
          bucket.appendChild(table);
        }

        // Append week groups in order (This Week first), filling in the count badges
        Object.values(bucketEls)
          .sort((a, b) => a._order - b._order)
          .forEach(details => {
            const countEl = details.querySelector(".week-count");
            if (countEl) countEl.textContent = details._count === 1 ? "1 day" : `${details._count} days`;
            section.appendChild(details);
          });

        container.appendChild(section);
      }
    }

    let currentTab = "";

    // Build the per-court time-range list used by both plot renderers
    function buildCourtRows(day) {
      const courts = new Map();
      getDayRows(day).forEach(row => {
        const { Location: location, Court: court, Time: time } = row;
        if (!time) return;
        const courtId = `${location}-${court}`;
        if (!courts.has(courtId)) {
          courts.set(courtId, {
            id: courtId,
            location,
            court,
            label: `${location} - ${court}`,
            timeRanges: []
          });
        }
        const timeRanges = extractTimeRanges(time);
        if (timeRanges.length === 0) {
          console.warn(`Failed to parse time ranges for court ${court} at ${location}: "${time}"`);
        }
        timeRanges.forEach(range => {
          courts.get(courtId).timeRanges.push({ startTime: range.start, endTime: range.end });
        });
      });
      return Array.from(courts.values()).sort((a, b) => {
        if (a.location !== b.location) return a.location.localeCompare(b.location);
        return courtNumber(a.court) - courtNumber(b.court);
      });
    }

    const plotPalette = [
      '#6366f1', '#f59e0b', '#10b981', '#ef4444', '#8b5cf6',
      '#06b6d4', '#f97316', '#84cc16', '#ec4899', '#14b8a6',
      '#3b82f6', '#fbbf24', '#22c55e', '#f87171', '#a855f7'
    ];
    const plotThemes = {
      light: {
        background: '#ffffff', text: '#374151', grid: 'rgba(148, 163, 184, 0.25)',
        accentGrid: 'rgba(99, 102, 241, 0.35)', rowLine: 'rgba(226, 232, 240, 0.8)',
        axis: 'rgba(100, 116, 139, 0.4)', barShadow: 'rgba(0, 0, 0, 0.12)'
      },
      dark: {
        background: '#1a1b2e', text: '#cbd5e1', grid: 'rgba(148, 163, 184, 0.14)',
        accentGrid: 'rgba(129, 140, 248, 0.45)', rowLine: 'rgba(255, 255, 255, 0.06)',
        axis: 'rgba(148, 163, 184, 0.35)', barShadow: 'rgba(0, 0, 0, 0.4)'
      }
    };
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');

    // Single renderer for both the on-screen plot and the exported PNG.
    // width: CSS px; fitHeight: shrink rows toward this height (on-screen only);
    // compact: phone-sized fonts/padding; theme: 'light' | 'dark'.
    function drawSchedulePlot(canvas, day, { width, fitHeight = null, compact = false, pixelRatio = 1, theme = 'light' }) {
      if (!day || !canvas) return;
      const ctx = canvas.getContext('2d');
      const colors = plotThemes[theme] || plotThemes.light;
      const courts = buildCourtRows(day);

      const locations = [...new Set(courts.map(c => c.location))];
      const colorMap = {};
      locations.forEach((loc, i) => { colorMap[loc] = plotPalette[i % plotPalette.length]; });

      const family = 'system-ui, -apple-system, sans-serif';
      const axisFont = `600 ${compact ? 10 : 12}px ${family}`;
      const labelFont = `500 ${compact ? 9 : 11}px ${family}`;
      const legendFont = `500 ${compact ? 10 : 11}px ${family}`;
      const padding = compact
        ? { top: 26, right: 12, bottom: 26, left: 100 }
        : { top: 36, right: 25, bottom: 34, left: 180 };
      const plotRight = width - padding.right;

      // Lay out the legend first (wrapping onto new lines) so we know the canvas height
      ctx.font = legendFont;
      const legendRowHeight = 18;
      const legendLeft = 12;
      const legendItems = [];
      let lx = legendLeft, lrow = 0;
      locations.forEach(loc => {
        const label = abbreviateLocation(loc);
        const itemWidth = 15 + ctx.measureText(label).width + 18;
        if (lx + itemWidth > width - 12 && lx > legendLeft) { lx = legendLeft; lrow++; }
        legendItems.push({ loc, label, x: lx, row: lrow });
        lx += itemWidth;
      });
      const legendHeight = locations.length ? (lrow + 1) * legendRowHeight + 8 : 0;

      const maxRowHeight = compact ? 30 : 35;
      const minRowHeight = compact ? 20 : 25;
      let rowHeight = maxRowHeight;
      if (fitHeight && courts.length) {
        const fit = (fitHeight - padding.top - padding.bottom - legendHeight) / courts.length;
        rowHeight = Math.max(minRowHeight, Math.min(maxRowHeight, fit));
      }
      const plotBottom = padding.top + courts.length * rowHeight;
      const height = plotBottom + padding.bottom + legendHeight;

      // Resizing the canvas resets the context state
      canvas.width = Math.round(width * pixelRatio);
      canvas.height = Math.round(height * pixelRatio);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.scale(pixelRatio, pixelRatio);
      ctx.fillStyle = colors.background;
      ctx.fillRect(0, 0, width, height);

      const startHour = 6;  // 6 AM
      const endHour = 23;   // 11 PM
      const hourWidth = (plotRight - padding.left) / (endHour - startHour);
      const xFor = hour => padding.left + (hour - startHour) * hourWidth;

      // Label every 1, 2 or 3 hours depending on room; short labels ("6a") when compact
      const labelStep = hourWidth >= 44 ? 1 : hourWidth >= 24 ? 2 : 3;
      ctx.font = axisFont;
      ctx.textAlign = 'center';
      for (let hour = startHour; hour <= endHour; hour++) {
        const x = xFor(hour);
        if ((hour - startHour) % labelStep === 0) {
          const displayHour = hour <= 12 ? hour : hour - 12;
          const ampm = hour < 12 ? 'AM' : 'PM';
          const label = compact ? `${displayHour}${ampm[0].toLowerCase()}` : `${displayHour} ${ampm}`;
          ctx.fillStyle = colors.text;
          ctx.fillText(label, x, padding.top - 12);
          ctx.fillText(label, x, plotBottom + 20);
        }
        // Vertical grid line, dotted at 4 PM and 8 PM
        ctx.beginPath();
        const accent = hour === 16 || hour === 20;
        ctx.setLineDash(accent ? [2, 4] : []);
        ctx.strokeStyle = accent ? colors.accentGrid : colors.grid;
        ctx.lineWidth = accent ? 1.5 : 1;
        ctx.moveTo(x, padding.top);
        ctx.lineTo(x, plotBottom);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      // Top and bottom axis lines
      ctx.strokeStyle = colors.axis;
      ctx.lineWidth = 1.5;
      [padding.top, plotBottom].forEach(y => {
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(plotRight, y);
        ctx.stroke();
      });

      // Court labels, row separators and time bars
      const barHeight = Math.max(8, rowHeight - (compact ? 10 : 14));
      courts.forEach((court, index) => {
        const y = padding.top + index * rowHeight + rowHeight / 2;

        ctx.fillStyle = colors.text;
        ctx.font = labelFont;
        ctx.textAlign = 'right';
        ctx.fillText(abbreviateLocation(court.label), padding.left - 6, y + 3);

        if (index < courts.length - 1) {
          ctx.strokeStyle = colors.rowLine;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(padding.left, y + rowHeight / 2);
          ctx.lineTo(plotRight, y + rowHeight / 2);
          ctx.stroke();
        }

        court.timeRanges.forEach(range => {
          // Clip to the visible window so early/late slots don't spill over the labels
          const start = Math.max(range.startTime, startHour);
          const end = Math.min(range.endTime, endHour);
          if (end <= start) return;
          const startX = xFor(start);
          const barWidth = xFor(end) - startX;

          ctx.shadowColor = colors.barShadow;
          ctx.shadowBlur = 4;
          ctx.shadowOffsetY = 2;
          ctx.fillStyle = colorMap[court.location];
          ctx.beginPath();
          ctx.roundRect(startX, y - barHeight / 2, barWidth, barHeight, Math.min(6, barHeight / 2, barWidth / 2));
          ctx.fill();
          ctx.shadowColor = 'transparent';
          ctx.shadowBlur = 0;
          ctx.shadowOffsetY = 0;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
          ctx.lineWidth = 1;
          ctx.stroke();
        });
      });

      // Legend
      ctx.font = legendFont;
      ctx.textAlign = 'left';
      const legendTop = plotBottom + padding.bottom + 4;
      legendItems.forEach(({ loc, label, x, row }) => {
        const y = legendTop + row * legendRowHeight;
        ctx.fillStyle = colorMap[loc];
        ctx.beginPath();
        ctx.roundRect(x, y, 10, 10, 2);
        ctx.fill();
        ctx.fillStyle = colors.text;
        ctx.fillText(label, x + 15, y + 9);
      });
    }

    // On-screen plot: fit the container and follow the page's light/dark theme
    function createPlot(day) {
      if (!day) return;
      const plotContainer = document.getElementById('plot-container');
      const compact = window.innerWidth <= 768;
      const inset = compact ? 16 : 30; // matches .plot-container padding
      const rect = plotContainer.getBoundingClientRect();
      drawSchedulePlot(document.getElementById('schedule-plot'), day, {
        width: rect.width - inset,
        fitHeight: rect.height - inset,
        compact,
        pixelRatio: window.devicePixelRatio || 1,
        theme: prefersDark.matches ? 'dark' : 'light'
      });
    }

    // Redraw when the system switches between light and dark
    prefersDark.addEventListener('change', () => {
      const isPlotView = document.getElementById('plot-view-btn').classList.contains('active');
      if (isPlotView && currentTab) createPlot(currentTab);
    });

    function switchTab(day) {
      document.querySelectorAll('.day-section').forEach(sec => sec.classList.remove('active'));
      Array.from(tabs.children).forEach(btn => btn.classList.toggle('active', btn.dataset.day === day));
      document.getElementById(`section-${day}`).classList.add('active');
      currentTab = day;

      // Check if we're in plot view
      const isPlotView = document.getElementById('plot-view-btn').classList.contains('active');
      
      // Set display based on current view
      if (isPlotView) {
        container.style.display = "none";
        document.getElementById('plot-container').style.display = "block";
        document.getElementById('copy-plot-button').style.display = "flex";
        createPlot(day);
      } else {
        container.style.display = "block";
        document.getElementById('plot-container').style.display = "none";
        document.getElementById('copy-plot-button').style.display = "none";
      }
    }

    // Improved copy function for better formatting
    document.getElementById("copy-button").addEventListener("click", () => {
      if (!currentTab) return;
      
      // Get today's date for comparison
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      // Group by date (already normalized to M/D/YYYY) then location
      const dateGroups = {};
      getDayRows(currentTab).forEach(row => {
        const { Date: date, Location: location, Court: court, Time: time } = row;
        if (!time) return;
        if (!dateGroups[date]) dateGroups[date] = {};
        if (!dateGroups[date][location]) dateGroups[date][location] = [];
        dateGroups[date][location].push({ court, time });
      });
      
      let todayData = '';
      let otherData = '';
      let todayDateDisplay = '';
      
      // Process each date group
      Object.entries(dateGroups).forEach(([date, locations]) => {
        // Parse date
        const dateParts = date.split('/');
        const month = parseInt(dateParts[0]);
        const day = parseInt(dateParts[1]);
        const year = parseInt(dateParts[2]);
        
        const dateObj = new Date(year, month - 1, day);
        dateObj.setHours(0, 0, 0, 0);
        
        // Format date for display
        const dateDisplay = `${month}/${day}`;
        
        // Add date with parentheses if not today
        const isToday = dateObj.getTime() === today.getTime();
        const datePrefix = isToday ? '' : `(${dateDisplay})`;
        
        if (isToday) {
          todayDateDisplay = dateDisplay;
        }
        
        // Process each location
        const sortedLocations = Object.keys(locations).sort();
        let sectionText = '';
        
        sortedLocations.forEach((location, index) => {
          const locationData = locations[location];
          
          // Mango Park is now available - process normally
          // (removed special unavailable handling)
          
          // Group by time and filter out empty times
          const timeGroups = {};
          locationData.forEach(item => {
            // Skip items with no valid time
            if (!item.time || item.time.trim() === '') {
              return;
            }
            if (!timeGroups[item.time]) {
              timeGroups[item.time] = [];
            }
            timeGroups[item.time].push(item.court);
          });
          
          const timeEntries = Object.entries(timeGroups);
          
          // Skip locations with no valid time entries
          if (timeEntries.length === 0) {
            return;
          }
          
          const simpleLocation = abbreviateLocation(location);
          
          if (timeEntries.length === 1) {
            const [time, courts] = timeEntries[0];
            sectionText += `${simpleLocation}${datePrefix}: ${courts.join(', ')}: ${time}\n`;
          } else {
            sectionText += `${simpleLocation}${datePrefix}:\n`;
            timeEntries.forEach(([time, courts]) => {
              sectionText += `  ${courts.join(', ')}: ${time}\n`;
            });
          }
          
          if (index < sortedLocations.length - 1) {
            sectionText += '\n';
          }
        });
        
        if (isToday) {
          todayData = sectionText;
        } else {
          otherData += sectionText;
        }
      });
      
      const text = `SNV LT 教练占场信息 ${currentTab} ${todayDateDisplay}\n${todayData}${otherData}`;
      
      const copyToast = document.getElementById("copy-toast");
      navigator.clipboard.writeText(text).then(() => {
        copyToast.textContent = "Copied Text ✅";
        showToast(copyToast, 1500);
      }).catch(err => {
        console.error("Text copy failed:", err);
        copyToast.textContent = "Copy failed ❌";
        showToast(copyToast, 2000);
      });
    });

    function showToast(el, ms) {
      el.style.opacity = 1;
      clearTimeout(el._hideTimer);
      el._hideTimer = setTimeout(() => { el.style.opacity = 0; }, ms);
    }
    
    // Direct copy plot to clipboard
    document.getElementById("copy-plot-button").addEventListener("click", copyPlotToClipboard);
    


    
    // Render the export-quality plot into an offscreen canvas so the on-screen plot is untouched
    function renderExportPlotBlob(day) {
      const exportCanvas = document.createElement('canvas');
      drawSchedulePlot(exportCanvas, day, { width: 800, pixelRatio: 2, theme: 'light' });
      return new Promise((resolve, reject) => {
        exportCanvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Canvas export failed')), 'image/png');
      });
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function copyPlotToClipboard() {
      if (!currentTab) {
        alert("Please select a day and switch to plot view first");
        return;
      }

      const plotToast = document.getElementById("plot-toast");
      plotToast.textContent = "Copying plot...";
      showToast(plotToast, 10000);

      const blobPromise = renderExportPlotBlob(currentTab);
      const filename = `SNV_LT_${currentTab}_${new Date().toISOString().slice(0, 10)}.png`;

      // Safari requires the ClipboardItem to be created synchronously inside the user
      // gesture, with the blob supplied as a promise. Chrome/Edge accept this form too.
      if (navigator.clipboard && navigator.clipboard.write && window.ClipboardItem) {
        try {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blobPromise })]);
          plotToast.textContent = "Plot copied to clipboard ✅";
          showToast(plotToast, 1500);
          return;
        } catch (err) {
          console.warn('Clipboard image write failed, falling back to download:', err);
        }
      }

      // Fallback: download the PNG (also the only option on Firefox and some Android browsers)
      try {
        downloadBlob(await blobPromise, filename);
        plotToast.textContent = "Clipboard unavailable, plot downloaded 📥";
        showToast(plotToast, 2500);
      } catch (err) {
        console.error('Plot export failed:', err);
        plotToast.textContent = "Copy failed ❌";
        showToast(plotToast, 2000);
      }
    }


    
    // Toggle between table and plot views
    document.getElementById('table-view-btn').addEventListener('click', () => {
      document.getElementById('table-container').style.display = 'block';
      document.getElementById('plot-container').style.display = 'none';
      document.getElementById('table-view-btn').classList.add('active');
      document.getElementById('plot-view-btn').classList.remove('active');
      document.getElementById('copy-plot-button').style.display = 'none';
    });
    
    document.getElementById('plot-view-btn').addEventListener('click', () => {
      document.getElementById('table-container').style.display = 'none';
      document.getElementById('plot-container').style.display = 'block';
      document.getElementById('table-view-btn').classList.remove('active');
      document.getElementById('plot-view-btn').classList.add('active');
      document.getElementById('copy-plot-button').style.display = 'flex';
      
      if (currentTab) {
        createPlot(currentTab);
      }
    });
    
    // Add window resize handler for responsive plot
    let resizeTimeout;
    window.addEventListener('resize', () => {
      // Debounce resize events
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        // Only recreate plot if we're currently viewing it
        const isPlotView = document.getElementById('plot-view-btn').classList.contains('active');
        if (isPlotView && currentTab) {
          createPlot(currentTab);
        }
      }, 250);
    });

    const today = new Date();
    const todayDay = expectedDays[today.getDay()];
    const defaultDay = grouped[todayDay] ? todayDay : expectedDays.find(day => grouped[day]);
    if (defaultDay) switchTab(defaultDay);

  } catch (error) {
    console.error("Failed to fetch or render schedule data:", error);
    document.getElementById("table-container").innerHTML = '<div class="status-message warning">Could not load schedule. Please check network or spreadsheet access.</div>';
  }
}


fetchAndRenderTable();

</script>
<div id="copy-toast" class="copy-toast">Copied Text ✅</div>
<div id="plot-toast" class="copy-toast">Copied Plot ✅</div>
</body>

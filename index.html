<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNV LT Courts Schedule (Multi-Tab)</title>
  <!-- Chart.js for plot visualization -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --surface: #ffffff;
      --background: #ffffff;
      --text-main: #0f172a;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
      --radius: 16px;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: var(--font-sans);
      background-color: var(--background);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      line-height: 1.5;
      padding-bottom: 100px; /* Space for FAB */
    }

    /* Header & Nav */
    .navbar {
      background: var(--surface);
      padding: 0.75rem 1rem; /* Reduced padding */
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
      border-bottom: 1px solid var(--border);
    }

    .navbar .brand {
      font-weight: 800;
      font-size: 1.1rem; /* Slightly smaller */
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-main);
    }

    .navbar .brand .logo { font-size: 1.25rem; }

    .navbar .actions {
      display: flex;
      gap: 0.5rem; /* Reduced gap */
      align-items: center;
    }

    /* Pill Buttons - Smaller Size */
    button {
      font-family: var(--font-sans);
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .navbar button, .segmented button {
      background: transparent;
      color: var(--text-secondary);
      padding: 0.4rem 0.8rem; /* Smaller padding */
      border-radius: 999px;
      font-size: 0.8rem; /* Smaller font */
    }

    .navbar button:hover, .segmented button:hover {
      background: var(--background);
      color: var(--text-main);
    }

    .navbar button.active, .segmented button.active {
      background: var(--text-main);
      color: white;
    }

    .segmented {
      background: var(--background);
      padding: 3px;
      border-radius: 999px;
      display: inline-flex;
    }

    .segmented button.active {
      background: white;
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    .view-toggle {
      display: inline-flex;
      background: var(--background);
      padding: 3px;
      border-radius: 999px;
      border: 1px solid var(--border);
      gap: 0.25rem;
    }

    .view-toggle button {
      border-radius: 999px;
      padding: 0.35rem 0.9rem;
      background: transparent;
      color: var(--text-secondary);
    }

    .view-toggle button.active {
      background: var(--primary);
      color: #fff;
      box-shadow: var(--shadow-sm);
    }

    /* Sticky Day Selector Bar */
    .tab-buttons {
      position: sticky;
      top: 60px; /* Adjusted for smaller navbar */
      z-index: 90;
      background: var(--surface);
      padding: 0.75rem 1rem;
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      scrollbar-width: none; /* Firefox */
      justify-content: center;
      flex-wrap: wrap;
    }

    .tab-buttons::-webkit-scrollbar { display: none; }

    /* Transform the existing bubble structure to a strip via CSS */
    .tab-buttons {
      width: 100% !important;
      height: auto !important;
      transform: none !important;
      flex-direction: row !important;
      justify-content: center !important;
      left: 0 !important;
      bottom: auto !important;
      max-height: none !important;
    }

    .tab-buttons::before { display: none !important; } /* Hide the "Day" label/bubble trigger */

    .tab-buttons button {
      display: block !important;
      opacity: 1 !important;
      transform: none !important;
      pointer-events: auto !important;
      margin: 0 !important;
      flex-shrink: 0;
      background: white;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 0.4rem 1rem;
      border-radius: 999px;
      font-size: 0.8rem;
      box-shadow: none;
    }

    body.plot-view-active .tab-buttons {
      position: static;
      top: auto;
      z-index: initial;
    }

    .tab-buttons button.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    /* Main Content */
    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.25rem 1.5rem;
    }

    .section-card {
      padding: 0;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      background: var(--surface);
      overflow: visible;
    }

    .section-card > * {
      border-bottom: 1px solid var(--border);
    }

    .section-card > *:last-child {
      border-bottom: none;
    }

    .footer-card {
      text-align: center;
      background: var(--surface);
      padding: 1.25rem 1.5rem;
    }

    .footer-card a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .footer-card a:hover { text-decoration: underline; }

    .eyebrow {
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      font-weight: 700;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: 1px solid transparent;
      padding: 0.55rem 1.1rem;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s ease, color 0.2s ease, border 0.2s ease, transform 0.2s ease;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover { background: #3b36c5; }

    .btn-ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--text-main);
    }

    .btn-ghost:hover {
      border-color: var(--text-secondary);
      color: var(--text-secondary);
    }

    .btn-small {
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      border-radius: 8px;
    }

    .day-section {
      animation: slideUp 0.3s ease-out;
      padding: 1rem 0;
    }

    .schedule-card {
      padding: 1.25rem 1.5rem;
    }

    .schedule-card .day-section + .day-section {
      border-top: 1px solid var(--border);
      margin-top: 1rem;
    }

    .date-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin: 1.5rem 0 0.75rem;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    /* Modern Card Table */
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    th {
      background: var(--background);
      color: var(--text-secondary);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.75rem 1rem;
      text-align: left;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
      font-size: 0.9rem;
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    
    /* Highlight location */
    td:first-child {
      font-weight: 700;
      color: var(--primary);
      width: 25%;
    }
    
    /* Courts */
    td:nth-child(2) {
      font-weight: 600;
      width: 25%;
    }
    
    /* Time pills */
    td:nth-child(3) {
      font-family: 'ui-monospace', 'SF Mono', Menlo, monospace;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    /* Floating Action Button (FAB) */
    .buttons-container {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 0.75rem;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(16px);
      border-radius: 999px;
      box-shadow: var(--shadow-lg);
    }

    .action-button {
      width: 56px;
      height: 56px;
      border-radius: var(--radius);
      background: var(--text-main);
      color: white;
      font-size: 1.25rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-lg);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease;
      position: relative;
    }

    .action-button:hover {
      transform: translateY(-3px) scale(1.02);
      background: black;
    }

    .action-button::after {
      content: attr(data-feedback);
      position: absolute;
      bottom: calc(100% + 6px);
      right: 0;
      background: var(--text-main);
      color: #fff;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.7rem;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      white-space: nowrap;
    }

    .action-button[data-state="copied"]::after {
      opacity: 1;
      transform: translateY(0);
      background: var(--success);
    }

    .action-button[data-state="copied"] {
      background: var(--success);
      color: white;
    }

    .action-button.error {
      background: #ef4444;
    }

    /* Mobile Optimizations */
    /* Compact Mobile Layout */
    @media (max-width: 768px) {

        .navbar {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            flex-wrap: nowrap;
            gap: 0.5rem;
            padding: 0.6rem;
            height: auto;
        }

        .navbar .brand {
            display: none;
        }

        .navbar .actions {
            display: flex;
            width: 100%;
            gap: 0.4rem;
            align-items: center;
        }

        .view-toggle,
        .segmented {
            flex: 1;
            min-width: 0;
        }

        .view-toggle button,
        .segmented button {
            flex: 1;
            padding: 0.4rem 0.6rem;
            font-size: 0.75rem;
        }

        #ann-btn {
            width: 44px;
            height: 44px;
            padding: 0;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        #ann-btn span.sr-only {
            display: none;
        }

        .tab-buttons {
            position: static;
            padding: 0.5rem 0.75rem;
            height: auto;
            align-items: center;
            justify-content: center;
        }

        .tab-buttons button {
            padding: 0.4rem 0.9rem;
            font-size: 0.85rem;
        }

        .app {
            padding: 0.5rem;
        }

        .day-section {
            padding: 0 0.5rem;
        }

        .date-title {
            font-size: 1rem;
            margin: 0.75rem 0 0.4rem;
            text-align: center;
        }

        table {
            display: table;
            width: 100%;
            table-layout: fixed;
            margin-bottom: 1rem;
        }

        th,
        td {
            padding: 8px 4px;
            font-size: 0.8rem;
            white-space: normal;
            word-wrap: break-word;
        }

        th:nth-child(1),
        td:nth-child(1) { width: 32%; }

        th:nth-child(2),
        td:nth-child(2) { width: 18%; text-align: center; }

        th:nth-child(3),
        td:nth-child(3) { width: 50%; }

        td:nth-child(2) { font-weight: 500; }

        td:nth-child(3) {
            font-family: var(--font-sans);
            font-size: 0.75rem;
            line-height: 1.2;
        }

        #plot-container {
            height: 40vh !important;
            min-height: 300px;
        }


        .buttons-container {
            bottom: 0.75rem;
            right: 0.75rem;
            flex-direction: row;
            border-radius: 20px;
            padding: 0.5rem;
            gap: 0.5rem;
        }

        .action-button {
            width: 48px;
            height: 48px;
            font-size: 1.1rem;
        }

        .announcement-content {
            padding: 1rem;
        }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Utilities */
    .loading, .error {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-secondary);
      font-weight: 500;
    }
    
    /* Plot adjustments */
    #plot-container {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1rem;
      box-shadow: var(--shadow);
      width: 100%;
      height: 70vh;
      position: relative;
      display: none;
    }

    .plot-legend {
      position: absolute;
      right: 12px;
      top: 12px;
      background: rgba(255,255,255,0.85);
      padding: 0.4rem 0.75rem;
      border-radius: var(--radius);
      font-size: 0.8rem;
      box-shadow: var(--shadow);
    }

    #schedule-plot {
      width: 100% !important;
      height: 100% !important;
    }

    .toast-stack {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 1200;
      pointer-events: none;
    }

    .toast {
      background: var(--success);
      color: white;
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.error {
      background: #ef4444;
    }

    /* Announcement Modal */
    .announcement-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 1100;
    }

    .announcement-modal.visible {
      display: flex;
    }

    .announcement-content {
      width: min(720px, 95vw);
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-height: 85vh;
      overflow-y: auto;
    }

    .announcement-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }

    .announcement-body {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .announcement-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .announcement-item {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
      background: var(--background);
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .announcement-item strong {
      display: block;
      margin-bottom: 0.35rem;
    }

    .announcement-empty {
      text-align: center;
      color: var(--text-secondary);
      padding: 1rem;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    .announcement-form {
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .modal-input {
      width: 100%;
      min-height: 90px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75rem;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      resize: vertical;
    }

    .modal-input:focus {
      outline: 2px solid var(--primary-light);
      border-color: var(--primary);
    }

    .day-checkboxes {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .day-checkboxes label {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .announcement-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: flex-end;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="brand"><span class="logo">🎾</span>SNV LT Schedule</div>
    <div class="actions">
      <div class="view-toggle" id="view-toggle">
        <button id="table-view-btn" class="active">Table</button>
        <button id="plot-view-btn">Plot</button>
      </div>
      <div class="segmented" id="week-toggle">
        <button id="week-all-btn">All Weeks</button>
        <button id="week-this-btn" class="active">This Week</button>
      </div>
      <button id="ann-btn" aria-label="Announcements">
        <span aria-hidden="true">📢</span>
        <span class="sr-only">Announcements</span>
      </button>
    </div>
  </div>
  <div class="app">
  <div class="section-card">
    <div id="tab-buttons" class="tab-buttons"></div>
    <div id="table-container" class="schedule-card loading">Loading schedule...</div>
    <div id="plot-container" class="schedule-card">
      <div id="location-legend" class="plot-legend"></div>
      <canvas id="schedule-plot"></canvas>
    </div>
    <!-- Footer with original data link -->
    <div class="footer-card">
      <a href="https://docs.google.com/spreadsheets/d/1zpnq9KvS73oZ8SK1JbUaBuK9u9nv_3NArXW1Hy7Pkzs/edit?gid=0#gid=0" target="_blank" rel="noopener">View Original Data →</a>
    </div>
  </div>
  <div id="original-table" class="sr-only" aria-hidden="true"></div>
  <div class="buttons-container" aria-live="polite">
    <button id="copy-fab" class="action-button" title="Copy Current Day" data-feedback="Copied!" aria-label="Copy schedule for selected day">
      <span aria-hidden="true">📋</span>
      <span class="sr-only">Copy schedule for current day</span>
    </button>
    <button id="copy-plot-button" class="action-button" title="Copy Plot" data-feedback="Copied!" style="display:none" aria-label="Copy plot as image">
      <span aria-hidden="true">🖼</span>
      <span class="sr-only">Copy plot image</span>
    </button>
  </div>
  <div id="announcement-modal" class="announcement-modal" aria-hidden="true">
    <div class="announcement-content">
      <div class="announcement-header">
        <div>
          <p class="eyebrow">Schedule Updates</p>
          <h3 style="margin:0;">Announcements</h3>
        </div>
        <button class="btn btn-ghost" type="button" onclick="toggleAnnouncementModal(false)">Close</button>
      </div>
      <div class="announcement-body">
        <div id="announcement-list" class="announcement-list"></div>
        <div class="announcement-form">
          <div>
            <p class="eyebrow">Add New</p>
            <h4 style="margin:0;">Keep everyone informed</h4>
          </div>
          <textarea id="announcement-text" class="modal-input" placeholder="Enter announcement text..."></textarea>
          <div class="day-selector">
            <p class="eyebrow" style="margin-bottom:0.25rem;">Apply to</p>
            <div class="day-checkboxes">
              <label><input type="checkbox" id="select-all-days" value="All"> All Days</label>
              <label><input type="checkbox" value="Sun"> Sun</label>
              <label><input type="checkbox" value="Mon"> Mon</label>
              <label><input type="checkbox" value="Tue"> Tue</label>
              <label><input type="checkbox" value="Wed"> Wed</label>
              <label><input type="checkbox" value="Thu"> Thu</label>
              <label><input type="checkbox" value="Fri"> Fri</label>
              <label><input type="checkbox" value="Sat"> Sat</label>
            </div>
          </div>
          <div class="announcement-buttons">
            <button class="btn btn-ghost" type="button" onclick="clearAllAnnouncements()">Clear All</button>
            <button class="btn btn-primary" type="button" onclick="addAnnouncement()">Add Announcement</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="toast-root" class="toast-stack" aria-live="polite" aria-atomic="true"></div>
  </div>
  <script>
    const SHEET_ID = '1zpnq9KvS73oZ8SK1JbUaBuK9u9nv_3NArXW1Hy7Pkzs';
    const SHEET_NAMES = [
      'Fremont High School',
      'Sunnyvale Middle School (Mango)',
      'Serra Park',
      'Ortega Park',
      'Ponderosa Park',
      'Washington Park',
      'Braly Park',
      'Encinal Park',
      'Orchard Gardens',
      'Columbia Park',
      'Lakewood Park',
      'Fairwood Park',
      'Seven Seas'

      dayRows.forEach(row=>{

        const parts=date.split('/').map(x=>parseInt(x));

}

if(announcementModal){announcementModal.addEventListener('click',e=>{if(e.target===announcementModal)toggleAnnouncementModal(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&announcementModal.classList.contains('visible'))toggleAnnouncementModal(false);});}

function loadAnnouncements() {
  try {
    const stored = localStorage.getItem('announcements');
    return stored ? JSON.parse(stored) : [];
  } catch (e) {
    console.error('Failed to load announcements:', e);
    return [];
  }
}

function saveAnnouncements(announcements) {
  try {
    localStorage.setItem('announcements', JSON.stringify(announcements));
  } catch (e) {
    console.error('Failed to save announcements:', e);
  }
}

function renderAnnouncements() {
  const announcements = loadAnnouncements();
  const list = document.getElementById('announcement-list');
  if (!list) return;
  list.innerHTML = '';
  if (!announcements.length) {
    const empty = document.createElement('div');
    empty.className = 'announcement-empty';
    empty.textContent = 'No announcements yet. Add one below to keep the team in sync.';
    list.appendChild(empty);
    return;
  }

  announcements.forEach((ann, idx) => {
    const item = document.createElement('div');
    item.className = 'announcement-item';

    const copy = document.createElement('div');
    copy.style.flex = '1';
    const days = document.createElement('strong');
    days.textContent = ann.days.join(', ');
    const text = document.createElement('div');
    text.textContent = ann.text;
    copy.appendChild(days);
    copy.appendChild(text);

    const actions = document.createElement('div');
    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'btn btn-ghost btn-small';
    deleteBtn.type = 'button';
    deleteBtn.textContent = 'Delete';
    deleteBtn.addEventListener('click', () => deleteAnnouncement(idx));
    actions.appendChild(deleteBtn);

    item.appendChild(copy);
    item.appendChild(actions);
    list.appendChild(item);
  });
}

function setupDaySelector() {
  const selectAll = document.getElementById('select-all-days');
  if (!selectAll) return;
  const dayBoxes = document.querySelectorAll('.day-checkboxes input[type="checkbox"]:not(#select-all-days)');

  if (selectAll.dataset.bound !== 'true') {
    selectAll.addEventListener('change', function() {
      dayBoxes.forEach(cb => { cb.checked = this.checked; });
      selectAll.indeterminate = false;
    });
    selectAll.dataset.bound = 'true';
  }

  dayBoxes.forEach(cb => {
    if (cb.dataset.bound === 'true') return;
    cb.addEventListener('change', function() {
      const boxes = document.querySelectorAll('.day-checkboxes input[type="checkbox"]:not(#select-all-days)');
      const checkedCount = Array.from(boxes).filter(x => x.checked).length;
      if (checkedCount === boxes.length) {
        selectAll.checked = true;
        selectAll.indeterminate = false;
      } else if (checkedCount === 0) {
        selectAll.checked = false;
        selectAll.indeterminate = false;
      } else {
        selectAll.checked = false;
        selectAll.indeterminate = true;
      }
    });
    cb.dataset.bound = 'true';
  });
}

function getSelectedDays() {
  const dayBoxes = document.querySelectorAll('.day-checkboxes input[type="checkbox"]:not(#select-all-days)');
  const selected = Array.from(dayBoxes).filter(cb => cb.checked).map(cb => cb.value);
  return document.getElementById('select-all-days').checked ? ['All'] : selected;
}

function addAnnouncement() {
  const textarea = document.getElementById('announcement-text');
  const text = (textarea.value || '').trim();
  if (!text) return;
  const days = getSelectedDays();
  if (days.length === 0) {
    alert('Please select at least one day');
    return;
  }
  const announcements = loadAnnouncements();
  announcements.push({ text, days });
  saveAnnouncements(announcements);
  renderAnnouncements();
  clearForm();
  showNotification('Announcement saved');
}

function editAnnouncement(idx) {
  const announcements = loadAnnouncements();
  const ann = announcements[idx];
  if (!ann) return;
  document.getElementById('announcement-text').value = ann.text;
  const dayBoxes = document.querySelectorAll('.day-checkboxes input[type="checkbox"]:not(#select-all-days)');
  dayBoxes.forEach(cb => {
    cb.checked = ann.days.includes('All') || ann.days.includes(cb.value);
  });
  deleteAnnouncement(idx);
}

function deleteAnnouncement(idx) {
  const announcements = loadAnnouncements();
  announcements.splice(idx, 1);
  saveAnnouncements(announcements);
  renderAnnouncements();
  showNotification('Announcement removed');
}

function clearAllAnnouncements() {
  if (confirm('Are you sure you want to clear all announcements?')) {
    saveAnnouncements([]);
    renderAnnouncements();
    showNotification('All announcements cleared');
  }
}

function clearForm() {
  document.getElementById('announcement-text').value = '';
  document.querySelectorAll('.day-checkboxes input[type="checkbox"]').forEach(cb => cb.checked = false);
  const selectAll = document.getElementById('select-all-days');
  if (selectAll) {
    selectAll.checked = false;
    selectAll.indeterminate = false;
  }
}

function getAnnouncementsForDay(day) {
  const announcements = loadAnnouncements();
  return announcements.filter(ann => ann.days.includes('All') || ann.days.some(d => day.startsWith(d)));
}

function getAnnouncementText(day) {
  const announcements = getAnnouncementsForDay(day);
  if (announcements.length === 0) return '';
  return '\n\n📢 Announcements:\n' + announcements.map(ann => `• ${ann.text}`).join('\n');
}

function showNotification(message, variant = 'success') {
  const stack = document.getElementById('toast-root');
  if (!stack) return;
  const toast = document.createElement('div');
  toast.className = `toast${variant === 'error' ? ' error' : ''}`;
  toast.textContent = message;
  stack.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('visible'));
  setTimeout(() => {
    toast.classList.remove('visible');
    toast.addEventListener('transitionend', () => toast.remove(), { once: true });
  }, 2200);
}

function setCopyButtonState(button, isSuccess, customMessage) {
  if (!button) return;
  const defaultFeedback = button.dataset.defaultFeedback || button.getAttribute('data-feedback') || 'Copied!';
  button.dataset.defaultFeedback = defaultFeedback;
  button.dataset.feedback = customMessage || (isSuccess ? defaultFeedback : 'Try again');
  button.dataset.state = 'copied';
  button.classList.toggle('error', !isSuccess);
  clearTimeout(button.__copyTimer);
  button.__copyTimer = setTimeout(() => {
    button.dataset.state = '';
    button.dataset.feedback = button.dataset.defaultFeedback;
    button.classList.remove('error');
  }, 2000);
}

    function createPlot(day,forCopy=false){
      if(!day)return;
      const canvas=document.getElementById('schedule-plot');
      const ctx=canvas.getContext('2d');
      const isMobile=window.matchMedia('(max-width: 768px)').matches;
      const barThickness=isMobile?26:44;
      const barRadius=isMobile?14:22;
      const tickFontSize=isMobile?10:12;
      const xTickFontSize=isMobile?10:11;
      
      // Get data from original table
      const originalTable=document.getElementById('original-table');
      const rows=Array.from(originalTable.querySelectorAll('tbody tr'));
      const dayData=rows.filter(row=>{
        const cells=Array.from(row.querySelectorAll('td'));
        return cells[0]?.textContent.trim()===day;
      });
      
      // Group by location and court
      const courtsMap={};
      dayData.forEach(row=>{
        const cells=Array.from(row.querySelectorAll('td'));
        if(cells.length<5)return;
        const location=cells[4].textContent.trim();
        const court=cells[3].textContent.trim();
        const time=cells[2].textContent.trim();
        if(!time||!time.trim())return;
        
        const key=`${location}|||${court}`;
        if(!courtsMap[key]){
          courtsMap[key]={
            location:location,
            court:court,
            times:[]
          };
        }
        
        const ranges=extractTimeRanges(time);
        courtsMap[key].times.push(...ranges);
      });
      
      // Convert to array and sort
      const courtsList=Object.values(courtsMap)
        .filter(c=>c.times.length>0)
        .sort((a,b)=>{
          if(a.location!==b.location)return a.location.localeCompare(b.location);
          const aNum=parseInt(a.court.match(/\d+/)?.[0])||0;
          const bNum=parseInt(b.court.match(/\d+/)?.[0])||0;
          return aNum-bNum;
        });
      
      // Create labels for Y-axis
      const yLabels=courtsList.map(c=>`${simplifyLocation(c.location)} ${c.court}`);
      
      // Calculate time bounds
      let minTime=24,maxTime=0;
      courtsList.forEach(court=>{
        court.times.forEach(t=>{
          if(t.start<minTime)minTime=t.start;
          if(t.end>maxTime)maxTime=t.end;
        });
      });
      minTime=Math.max(8,Math.floor(minTime-0.5));
      maxTime=Math.min(22,Math.ceil(maxTime+0.5));
      
      // Create color map
      const locations=[...new Set(courtsList.map(c=>c.location))];
      const colors=['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22'];
      const colorMap={};
      locations.forEach((loc,i)=>colorMap[loc]=colors[i%colors.length]);
      
      // Create datasets - one per time slot
      const allData=[];
      courtsList.forEach((court,idx)=>{
        court.times.forEach(timeRange=>{
          allData.push({
            x:[timeRange.start,timeRange.end],
            y:yLabels[idx],
            backgroundColor:colorMap[court.location],
            borderColor:'rgba(255,255,255,0.6)',
            borderWidth:1,
            barThickness:44
          });
        });
      });
      
      // Single dataset with all bars
      const datasets=[{
        data:allData,
        backgroundColor:allData.map(d=>d.backgroundColor),
        borderColor:allData.map(d=>d.borderColor),
        borderWidth:1,
        barThickness:barThickness,
        borderRadius:barRadius,
        borderSkipped:false,
        categoryPercentage:0.95,
        barPercentage:0.95
      }];
      
      // Destroy old chart
      if(window.scheduleChart)window.scheduleChart.destroy();
      
      // Create chart
      window.scheduleChart=new Chart(ctx,{
        type:'bar',
        data:{
          labels:yLabels,
          datasets:datasets
        },
        options:{
          indexAxis:'y',
          responsive:true,
          maintainAspectRatio:false,
          elements:{
            bar:{
              borderRadius:barRadius,
              borderSkipped:false
            }
          },
          datasets:{
            bar:{
              borderRadius:barRadius,
              borderSkipped:false,
              categoryPercentage:0.95,
              barPercentage:0.95,
              barThickness:barThickness,
              maxBarThickness:barThickness+6
            }
          },
          scales:{
            x:{
              type:'linear',
              min:minTime,
              max:maxTime,
              grid:{color:'rgba(148,163,184,0.2)'},
              ticks:{
                stepSize:1,
                font:{size:xTickFontSize},
                callback:v=>{
                  const h=Math.floor(v);
                  if(h===12)return'12PM';
                  if(h>12)return`${h-12}PM`;
                  return`${h}AM`;
                }
              },
              title:{display:true,text:'Time'}
            },
            y:{
              type:'category',
              labels:yLabels,
              ticks:{
                font:{size:tickFontSize,weight:'600'}
              }
            }
          },
          plugins:{
            legend:{display:false},
            tooltip:{
              callbacks:{
                label:ctx=>{
                  const d=ctx.raw;
                  const formatTime=h=>{
                    const hr=Math.floor(h);
                    const min=Math.round((h-hr)*60);
                    const h12=hr>12?hr-12:(hr===0?12:hr);
                    const p=hr>=12?'PM':'AM';
                    return min===0?`${h12}${p}`:`${h12}:${min.toString().padStart(2,'0')}${p}`;
                  };
                  return`${formatTime(d.x[0])}-${formatTime(d.x[1])}`;
                }
              }
            }
          }
        }
      });
      
      // Hide legend
      document.getElementById('location-legend').style.display='none';
    }
